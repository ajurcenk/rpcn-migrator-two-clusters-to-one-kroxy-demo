# Kroxylicious 0.24.0's stock config/log4j2.yaml, plus the "demo.cgprefix" logger.
# CG_PREFIX_LOG_LEVEL controls the filter's rewrite logging (DEBUG by default).
---
Configuration:
  status: WARN
  shutdownHook: disable
  name: Config
  Appenders:
    Console:
      - name: STDOUT-PATTERN
        target: SYSTEM_OUT
        PatternLayout:
          pattern: "%d{yyyy-MM-dd HH:mm:ss} %-5p <%t> %c{2.} - %m%replace{ %mdc}{' $'}{}%n"
      - name: STDOUT-JSON
        target: SYSTEM_OUT
        JsonTemplateLayout:
          eventTemplateUri: "${env:KROXYLICIOUS_LOG_JSON_TEMPLATE:-classpath:LogstashJsonEventLayoutV1.json}"
    Routing:
      name: STDOUT
      Routes:
        pattern: "${env:KROXYLICIOUS_LOG_FORMAT:-text}"
        Route:
          - key: json
            ref: STDOUT-JSON
          - key: text
            ref: STDOUT-PATTERN
  Loggers:
    Root:
      level: "${env:KROXYLICIOUS_ROOT_LOG_LEVEL:-WARN}"
      additivity: false
      AppenderRef:
        - ref: STDOUT
    Logger:
      - name: io.kroxylicious
        level: "${env:KROXYLICIOUS_APP_LOG_LEVEL:-${env:KROXYLICIOUS_ROOT_LOG_LEVEL:-INFO}}"
        additivity: false
        AppenderRef:
          - ref: STDOUT
      - name: demo.cgprefix
        level: "${env:CG_PREFIX_LOG_LEVEL:-DEBUG}"
        additivity: false
        AppenderRef:
          - ref: STDOUT
      - name: com.github.benmanes.caffeine.cache.LocalAsyncCache
        level: ERROR
        additivity: false
        AppenderRef:
          - ref: STDOUT
